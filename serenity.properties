webdriver.driver=chrome
webdriver.autodownload=true
serenity.browser.maximized=true
serenity.take.screenshots=FOR_EACH_ACTION
serenity.step.delay=500
serenity.timeout=30000
webdriver.wait.for.timeout=30000
webdriver.timeouts.implicitlywait=2000
serenity.restart.browser.for.each=scenario
serenity.use.unique.browser=false
serenity.report.encoding=UTF-8
chrome.switches=--start-maximized;--incognito;--remote-allow-origins=*;--disable-notifications;--disable-save-password-bubble;--disable-features=PasswordManagerOnboarding,AutofillServerCommunication,PasswordLeakDetection
